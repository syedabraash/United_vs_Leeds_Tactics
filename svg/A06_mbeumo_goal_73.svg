he earlier finding: a runner</text><text x="714.0" y="272.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">arriving in a high-value spot, not a crowded</text><text x="714.0" y="294.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">cross.</text><circle cx="698" cy="323" r="4.5" fill="#C8102E"/><text x="714.0" y="328.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">The improvement followed Baleba, Zirkzee and Dalot</text><text x="714.0" y="350.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">coming on, but the game state also changed. Cause</text><text x="714.0" y="372.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">is unproven.</text><text x="690.0" y="581.0" font-size="16" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Key</text><circle cx="708" cy="605" r="9" fill="#C8102E"/><text x="736.0" y="610.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Man United player</text><circle cx="708" cy="633" r="9" fill="#34507F"/><text x="736.0" y="638.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Opponent (Spurs / Leeds)</text><path d="M690 661 L724 661" stroke="#E08A00" stroke-width="3.5" marker-end="url(#ao)" fill="none"/><text x="736.0" y="666.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Ball / pass / cross</text><path d="M690 689 L724 689" stroke="#2E8