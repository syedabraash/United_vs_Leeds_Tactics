<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#E08A00"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#374151"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C0392B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E8B57"/></marker></defs><rect width="1200" height="800" fill="#fff"/><text x="40.0" y="48.0" font-size="28" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">B1. Leeds away: what United are walking into</text><text x="40.0" y="78.0" font-size="17" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">Leeds v Man United, Sunday 18 October 2026, Elland Road (Squawka preview; kick-off time not checked)</text><rect x="40" y="120" width="550" height="280" rx="12" fill="#E8F5EC" stroke="#2E8B57" stroke-width="2.5"/><text x="58.0" y="154.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1B5E3A">Leeds are a hard side to play against</text><text x="58.0" y="186.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1B5E3A">Nine points from six league games and unbeaten until last weekend.</text><text x="58.0" y="208.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1B5E3A">Arteta singled out their organisation, physicality and set-piece</text><text x="58.0" y="230.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1B5E3A">threat after Arsenal won 2-1.</text><rect x="610" y="120" width="550" height="280" rx="12" fill="#FFF3DC" stroke="#E08A00" stroke-width="2.5"/><text x="628.0" y="154.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7A4A00">Arsenal 2-1 Leeds (10 Oct)</text><text x="628.0" y="186.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7A4A00">Leeds were the better side for an hour and led through Justin (55'),</text><text x="628.0" y="208.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7A4A00">then lost to goals from Calafiori (62') and Guimarães after Arsenal's</text><text x="628.0" y="230.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7A4A00">triple change. Leeds finished with just 0.68 xG; Arsenal had 2.17 xG</text><text x="628.0" y="252.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7A4A00">in the second half.</text><rect x="40" y="420" width="550" height="280" rx="12" fill="#FBE9E7" stroke="#C0392B" stroke-width="2.5"/><text x="58.0" y="454.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">United's baseline</text><text x="58.0" y="486.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">Six points from six games, their fewest at this stage since 1986-87.</text><text x="58.0" y="508.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">The Spurs draw showed a disconnected press, weak central control and a</text><text x="58.0" y="530.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">late equaliser against ten men.</text><rect x="610" y="420" width="550" height="280" rx="12" fill="#F1F2F4" stroke="#6B7280" stroke-width="2.5"/><text x="628.0" y="454.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#374151">Availability caveats</text><text x="628.0" y="486.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#374151">Shaw and Mainoo picked up issues against Spurs and were doubtful in</text><text x="628.0" y="508.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#374151">the latest reports. Šeško and Ugarte are listed as unavailable.</text><text x="628.0" y="530.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#374151">Confirm the team sheet before relying on any named XI.</text><text x="40.0" y="788.0" font-size="12" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">Schematic whiteboard illustration: positions are approximate. Match figures: Opta Analyst, Soccerway, xGStat and the shared reports; not independently verified.</text></svg>