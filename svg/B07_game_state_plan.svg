nt-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#fff">Fresh pace</text><rect x="950.0" y="150" width="150.0" height="40" rx="6" fill="#C0392B"/><text x="1025.0" y="176.0" font-size="14" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#fff">Protect</text><line x1="200" y1="208" x2="1100.0" y2="208" stroke="#1F2933" stroke-width="2"/><text x="200.0" y="232.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">0'</text><text x="350.0" y="232.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">15'</text><text x="500.0" y="232.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">30'</text><text x="650.0" y="232.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">45'</text><text x="800.0" y="232.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">60'</text><text x="950.0" y="232.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">75'</text><text x="1100.0" y="232.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">90'</text><rect x="40" y="270" width="270" height="210" rx="12" fill="#F1F2F4" stroke="#6B7280" stroke-width="2.5"/><text x="58.0" y="304.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#374151">First 15 minutes</text><text x="58.0" y="336.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#374151">Keep the midfield compact, avoid</text><text x="58.0" y="358.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#374151">unnecessary turnovers and test</text><text x="58.0" y="380.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#374151">the space behind the wing-backs.</text><rect x="330" y="270" width="270" height="210" rx="12" fill="#E8F5EC" stroke="#2E8B57" stroke-width="2.5"/><text x="348.0" y="304.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1B5E3A">United score first</text><text x="348.0" y="336.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1B5E3A">Keep attacking selectively. Do</text><text x="348.0" y="358.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1B5E3A">not retreat into a passive low</text><text x="348.0" y="380.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1B5E3A">block.</text><rect x="620" y="270" width="270" height="210" rx="12" fill="#FBE9E7" stroke="#C0392B" stroke-width="2.5"/><text x="638.0" y="304.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">Leeds score first</text><text x="638.0" y="336.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">Speed up circulation and use</text><text x="638.0" y="358.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">diagonal runs behind the wing-</text><text x="638.0" y="380.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">backs. Avoid forcing central</text><text x="638.0" y="402.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">passes.</text><rect x="910" y="270" width="250" height="210" rx="12" fill="#FFF3DC" stroke="#E08A00" stroke-width="2.5"/><text x="928.0" y="304.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7A4A00">Level after 60'</text><text x="928.0" y="336.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7A4A00">Bring on fresh pace and a</text><text x="928.0" y="358.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7A4A00">more direct runner; target</text><text x="928.0" y="380.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7A4A00">tired wide defenders.</text><rect x="40" y="500" width="1120" height="190" rx="12" fill="#FBE9E7" stroke="#C0392B" stroke-width="2.5"/><text x="58.0" y="534.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">Leading after 75'</text><text x="58.0" y="566.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">Keep a counterattacking outlet, protect second balls, stop uncontested crosses and press the crosser. Do not drop the whole team into the box. If</text><text x="58.0" y="588.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">Leeds go more direct, adjust the midfield and centre-backs' starting positions before the pressure builds.</text><text x="40.0" y="788.0" font-size="12" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">Schematic whiteboard illustration: positions are approximate. Match figures: Opta Analyst, Soccerway, xGStat and the shared reports; not independently verified.</text></svg>