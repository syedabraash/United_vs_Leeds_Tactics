 Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Opponent (Spurs / Leeds)</text><path d="M690 661 L724 661" stroke="#E08A00" stroke-width="3.5" marker-end="url(#ao)" fill="none"/><text x="736.0" y="666.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Ball / pass / cross</text><path d="M690 689 L724 689" stroke="#C0392B" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ar)" fill="none"/><text x="736.0" y="694.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Opponent counter</text><circle cx="708" cy="717" r="11" fill="#fff" stroke="#1F2933" stroke-width="2"/><text x="708.0" y="722.0" font-size="13" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">1</text><text x="736.0" y="722.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Numbered step</text><text x="40.0" y="788.0" font-size="12" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">Schematic whiteboard illustration: positions are approximate. Match figures: Opta Analyst, Soccerway, xGStat and the shared reports; not independently verified.</text></svg>