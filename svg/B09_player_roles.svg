<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#E08A00"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#374151"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C0392B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E8B57"/></marker></defs><rect width="1200" height="800" fill="#fff"/><text x="40.0" y="48.0" font-size="28" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">B9. Specific roles for the key players</text><text x="40.0" y="78.0" font-size="17" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">Role instructions from the shared plan. Check fitness and the confirmed XI first</text><rect x="40" y="120" width="1120" height="76" rx="10" fill="#F1F2F4" stroke="#D1D5DB" stroke-width="1.5"/><text x="62.0" y="164.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#C8102E">Bruno Fernandes</text><text x="290.0" y="154.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Stay between Leeds' midfield and defence. Prioritise through-balls into the</text><text x="290.0" y="176.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">channels over speculative long shots.</text><rect x="40" y="208" width="1120" height="76" rx="10" fill="#F1F2F4" stroke="#D1D5DB" stroke-width="1.5"/><text x="62.0" y="252.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#C8102E">Bryan Mbeumo</text><text x="290.0" y="242.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Pin the central defenders, then run into the channel behind the outside</text><text x="290.0" y="264.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">centre-back.</text><rect x="40" y="296" width="1120" height="76" rx="10" fill="#F1F2F4" stroke="#D1D5DB" stroke-width="1.5"/><text x="62.0" y="340.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#C8102E">Matheus Cunha</text><text x="290.0" y="330.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Carry the ball at the defence, but do not drop so deep that the box loses its</text><text x="290.0" y="352.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">striker.</text><rect x="40" y="384" width="1120" height="76" rx="10" fill="#F1F2F4" stroke="#D1D5DB" stroke-width="1.5"/><text x="62.0" y="428.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#C8102E">Amad Diallo</text><text x="290.0" y="418.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Hold width early, isolate the wing-back and attack inside once the overlapping</text><text x="290.0" y="440.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">run creates space.</text><rect x="40" y="472" width="1120" height="76" rx="10" fill="#F1F2F4" stroke="#D1D5DB" stroke-width="1.5"/><text x="62.0" y="516.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#C8102E">Kobbie Mainoo</text><text x="290.0" y="506.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Receive on the half-turn and play forward early. Do not force the pass if the</text><text x="290.0" y="528.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">centre is closed.</text><rect x="40" y="560" width="1120" height="76" rx="10" fill="#F1F2F4" stroke="#D1D5DB" stroke-width="1.5"/><text x="62.0" y="604.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#C8102E">Youri Tielemans</text><text x="290.0" y="594.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Stay connected to the defence and screen the central transition lane when the</text><text x="290.0" y="616.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">full-backs advance.</text><rect x="40" y="648" width="1120" height="76" rx="10" fill="#F1F2F4" stroke="#D1D5DB" stroke-width="1.5"/><text x="62.0" y="692.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#C8102E">Harry Maguire</text><text x="290.0" y="682.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Attack the first aerial ball. Martínez covers the space behind and the second-</text><text x="290.0" y="704.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">ball zone.</text><text x="40.0" y="788.0" font-size="12" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">Schematic whiteboard illustration: positions are approximate. Match figures: Opta Analyst, Soccerway, xGStat and the shared reports; not independently verified.</text></svg>