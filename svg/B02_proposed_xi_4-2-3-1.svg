ial, 'DejaVu Sans', sans-serif" fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round">Tielemans</text><text x="341.4" y="553.6" font-size="13" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Tielemans</text><text x="115.8" y="416.1" font-size="13" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round">Cunha</text><text x="115.8" y="416.1" font-size="13" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Cunha</text><text x="285.0" y="429.2" font-size="13" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round">Fernandes</text><text x="285.0" y="429.2" font-size="13" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Fernandes</text><text x="454.2" y="416.1" font-size="13" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round">Amad</text><text x="454.2" y="416.1" font-size="13" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Amad</text><text x="285.0" y="258.9" font-size="13" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round">Mbeumo</text><text x="285.0" y="258.9" font-size="13" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Mbeumo</text><text x="570.0" y="130.0" font-size="20" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">What to notice</text><line x1="570" y1="142" x2="1160" y2="142" stroke="#D1D5DB" stroke-width="2"/><circle cx="578" cy="167" r="4.5" fill="#C8102E"/><text x="594.0" y="172.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Two midfielders protect the centre, Bruno works between the</text><text x="594.0" y="194.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">lines, Mbeumo is the mobile striker.</text><circle cx="578" cy="223" r="4.5" fill="#C8102E"/><text x="594.0" y="228.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Amad stretches the right and attacks space behind the wing-back;</text><text x="594.0" y="250.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Cunha carries from the left half-space.</text><circle cx="578" cy="279" r="4.5" fill="#C8102E"/><text x="594.0" y="284.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">This is a tactical proposal, not a confirmed lineup. Squawka's</text><text x="594.0" y="306.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">predicted XI has Cunha right and Amad left.</text><circle cx="578" cy="335" r="4.5" fill="#C8102E"/><text x="594.0" y="340.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">If Mainoo is out, Tielemans must progress the ball more. If Shaw</text><text x="594.0" y="362.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">is out, keep the right-back more conservative.</text><text x="570.0" y="586.0" font-size="16" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Key</text><circle cx="588" cy="610" r="9" fill="#C8102E"/><text x="616.0" y="615.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Man United player</text><path d="M570 638 L604 638" stroke="#374151" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#ak)" fill="none"/><text x="616.0" y="643.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Player run</text><text x="40.0" y="788.0" font-size="12" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">Schematic whiteboard illustration: positions are approximate. Match figures: Opta Analyst, Soccerway, xGStat and the shared reports; not independently verified.</text></svg>