<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#E08A00"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#374151"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C0392B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E8B57"/></marker></defs><rect width="1200" height="800" fill="#fff"/><text x="40.0" y="48.0" font-size="28" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">A2. How the match unfolded</text><text x="40.0" y="78.0" font-size="17" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">Spurs 1-1 United: four phases, from build-up trouble to the late equaliser (Opta Analyst and match reports)</text><rect x="60.0" y="140" width="650.2" height="44" rx="6" fill="#34507F"/><text x="385.1" y="168.0" font-size="14" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#fff">Spurs on top, United booed off at half-time</text><rect x="710.2" y="140" width="154.3" height="44" rx="6" fill="#E08A00"/><text x="787.3" y="168.0" font-size="14" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#fff">United improve</text><rect x="864.5" y="140" width="275.5" height="44" rx="6" fill="#C0392B"/><text x="1002.2" y="168.0" font-size="14" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#fff">Lead, extra man, equaliser</text><line x1="60" y1="250" x2="1140" y2="250" stroke="#1F2933" stroke-width="2"/><line x1="60.0" y1="250" x2="60.0" y2="258" stroke="#1F2933" stroke-width="2"/><text x="60.0" y="280.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">0'</text><line x1="225.3" y1="250" x2="225.3" y2="258" stroke="#1F2933" stroke-width="2"/><text x="225.3" y="280.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">15'</text><line x1="390.6" y1="250" x2="390.6" y2="258" stroke="#1F2933" stroke-width="2"/><text x="390.6" y="280.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">30'</text><line x1="555.9" y1="250" x2="555.9" y2="258" stroke="#1F2933" stroke-width="2"/><text x="555.9" y="280.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">45'</text><line x1="721.2" y1="250" x2="721.2" y2="258" stroke="#1F2933" stroke-width="2"/><text x="721.2" y="280.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">60'</text><line x1="886.5" y1="250" x2="886.5" y2="258" stroke="#1F2933" stroke-width="2"/><text x="886.5" y="280.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">75'</text><line x1="1051.8" y1="250" x2="1051.8" y2="258" stroke="#1F2933" stroke-width="2"/><text x="1051.8" y="280.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">90'</text><text x="1140.0" y="280.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">90+8</text><circle cx="104.1" cy="232" r="12" fill="#fff" stroke="#1F2933" stroke-width="2"/><text x="104.1" y="237.0" font-size="13" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">1</text><circle cx="75" cy="325" r="12" fill="#fff" stroke="#1F2933" stroke-width="2"/><text x="75.0" y="330.0" font-size="13" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">1</text><text x="100.0" y="330.0" font-size="17" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Early (minute not given): Lammens' pass goes straight to Bergvall; he then saves Solanke's shot</text><circle cx="291.4" cy="232" r="12" fill="#fff" stroke="#1F2933" stroke-width="2"/><text x="291.4" y="237.0" font-size="13" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">2</text><circle cx="75" cy="365" r="12" fill="#fff" stroke="#1F2933" stroke-width="2"/><text x="75.0" y="370.0" font-size="13" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">2</text><text x="100.0" y="370.0" font-size="17" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">~21': Kudus shoots narrowly wide after a quick Spurs counter down the left</text><circle cx="555.9" cy="232" r="12" fill="#fff" stroke="#1F2933" stroke-width="2"/><text x="555.9" y="237.0" font-size="13" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">3</text><circle cx="75" cy="405" r="12" fill="#fff" stroke="#1F2933" stroke-width="2"/><text x="75.0" y="410.0" font-size="13" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">3</text><text x="100.0" y="410.0" font-size="17" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">45': United booed off. Amad's shot straight at Kinsky was their only real first-half chance</text><circle cx="710.2" cy="232" r="12" fill="#fff" stroke="#1F2933" stroke-width="2"/><text x="710.2" y="237.0" font-size="13" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">4</text><circle cx="75" cy="445" r="12" fill="#fff" stroke="#1F2933" stroke-width="2"/><text x="75.0" y="450.0" font-size="13" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">4</text><text x="100.0" y="450.0" font-size="17" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">59': Baleba on for Tielemans; Zirkzee for Amad; Dalot for Yoro</text><circle cx="864.5" cy="232" r="12" fill="#fff" stroke="#1F2933" stroke-width="2"/><text x="864.5" y="237.0" font-size="13" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">5</text><circle cx="75" cy="485" r="12" fill="#fff" stroke="#1F2933" stroke-width="2"/><text x="75.0" y="490.0" font-size="13" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">5</text><text x="100.0" y="490.0" font-size="17" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">73': Mbeumo turns on Cunha's pass and scores (1-0)</text><circle cx="919.6" cy="232" r="12" fill="#fff" stroke="#1F2933" stroke-width="2"/><text x="919.6" y="237.0" font-size="13" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">6</text><circle cx="75" cy="525" r="12" fill="#fff" stroke="#1F2933" stroke-width="2"/><text x="75.0" y="530.0" font-size="13" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">6</text><text x="100.0" y="530.0" font-size="17" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">78': Bentancur sent off for head-to-head contact with Shaw</text><circle cx="1073.9" cy="232" r="12" fill="#fff" stroke="#1F2933" stroke-width="2"/><text x="1073.9" y="237.0" font-size="13" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">7</text><circle cx="75" cy="565" r="12" fill="#fff" stroke="#1F2933" stroke-width="2"/><text x="75.0" y="570.0" font-size="13" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">7</text><text x="100.0" y="570.0" font-size="17" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">90+2': Solanke glances in Tonali's cross (1-1) with Martínez grappling him. Eight minutes were added</text><circle cx="48" cy="645" r="4.5" fill="#C8102E"/><text x="62.0" y="650.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Mbeumo has now scored seven Premier League goals against Spurs, more than against any other club.</text><circle cx="48" cy="675" r="4.5" fill="#C8102E"/><text x="62.0" y="680.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">United have six points from six games, their fewest at this stage since 1986-87.</text><text x="40.0" y="788.0" font-size="12" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">Schematic whiteboard illustration: positions are approximate. Match figures: Opta Analyst, Soccerway, xGStat and the shared reports; not independently verified.</text></svg>