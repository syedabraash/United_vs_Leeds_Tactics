vetica, Arial, 'DejaVu Sans', sans-serif" fill="#C0392B">Pivot covered by Spurs midfield</text><text x="690.0" y="130.0" font-size="20" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">What to notice</text><line x1="690" y1="142" x2="1160" y2="142" stroke="#D1D5DB" stroke-width="2"/><circle cx="698" cy="167" r="4.5" fill="#C8102E"/><text x="714.0" y="172.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Spurs pressed hard from the start and had six</text><text x="714.0" y="194.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">attempts before United registered a shot.</text><circle cx="698" cy="223" r="4.5" fill="#C8102E"/><text x="714.0" y="228.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">1 Lammens plays straight to Bergvall. 2 Bergvall</text><text x="714.0" y="250.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">feeds Solanke. 3 Lammens scrambles to keep out the</text><text x="714.0" y="272.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">shot.</text><circle cx="698" cy="301" r="4.5" fill="#C8102E"/><text x="714.0" y="306.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Carrick afterwards: United were late to press,</text><text x="714.0" y="328.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">struggled to find passes and left spaces.</text><circle cx="698" cy="357" r="4.5" fill="#C8102E"/><text x="714.0" y="362.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Reading (inference): when the first pass is rushed</text><text x="714.0" y="384.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">and the pivot is covered, United are forced into</text><text x="714.0" y="406.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">risky balls.</text><text x="690.0" y="553.0" font-size="16" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Key</text><circle cx="708" cy="577" r="9" fill="#C8102E"/><text x="736.0" y="582.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Man United player</text><circle cx="708" cy="605" r="9" fill="#34507F"/><text x="736.0" y="610.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Opponent (Spurs / Leeds)</text><path d="M690 633 L724 633" stroke="#E08A00" stroke-width="3.5" marker-end="url(#ao)" fill="none"/><text x="736.0" y="638.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Ball / pass / cross</text><path d="M690 661 L724 661" stroke="#C0392B" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ar)" fill="none"/><text x="736.0" y="666.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Opponent counter</text><rect x="690" y="680" width="36" height="18" rx="4" fill="#C0392B" fill-opacity=".1" stroke="#C0392B" stroke-width="2" stroke-dasharray="5 3"/><text x="736.0" y="694.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helveti