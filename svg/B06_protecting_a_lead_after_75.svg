ns-serif" fill="#1F2933">cross: no free crosses.</text><circle cx="698" cy="223" r="4.5" fill="#C8102E"/><text x="714.0" y="228.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">2 Assign near-post, central and far-post roles</text><text x="714.0" y="250.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">before the delivery arrives.</text><circle cx="698" cy="279" r="4.5" fill="#C8102E"/><text x="714.0" y="284.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">3 Defend the central lane first and keep the</text><text x="714.0" y="306.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">defensive line connected.</text><circle cx="698" cy="335" r="4.5" fill="#C8102E"/><text x="714.0" y="340.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">4 Keep one credible outlet high (Mbeumo) so Leeds</text><text x="714.0" y="362.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">must respect the counter. Fresh midfield legs</text><text x="714.0" y="384.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">protect second balls.</text><text x="690.0" y="553.0" font-size="16" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Key</text><circle cx="708" cy="577" r="9" fill="#C8102E"/><text x="736.0" y="582.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Man United player</text><circle cx="7