<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#E08A00"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#374151"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C0392B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E8B57"/></marker></defs><rect width="1200" height="800" fill="#fff"/><text x="40.0" y="48.0" font-size="28" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">A8. What the data establishes and what still needs video</text><text x="40.0" y="78.0" font-size="17" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">Status of each claim in the Spurs analysis</text><rect x="40" y="125" width="1120" height="92" rx="12" fill="#E8F5EC" stroke="#2E8B57" stroke-width="2.5"/><text x="62.0" y="163.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1B5E3A">Spurs created better chances</text><text x="500.0" y="159.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1B5E3A">More box touches, more big chances and higher xG in all three models</text><text x="500.0" y="180.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1B5E3A">(Opta, Soccerway, xGStat).</text><rect x="950" y="154" width="190" height="34" rx="17" fill="#2E8B57"/><text x="1045.0" y="177.0" font-size="14" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#fff">Strongly supported</text><rect x="40" y="230" width="1120" height="92" rx="12" fill="#E8F5EC" stroke="#2E8B57" stroke-width="2.5"/><text x="62.0" y="268.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1B5E3A">United struggled in the first half</text><text x="500.0" y="264.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1B5E3A">Carrick's own comments and match reports agree. Spurs had six attempts</text><text x="500.0" y="285.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1B5E3A">before United's first shot.</text><rect x="950" y="259" width="190" height="34" rx="17" fill="#2E8B57"/><text x="1045.0" y="282.0" font-size="14" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#fff">Confirmed</text><rect x="40" y="335" width="1120" height="92" rx="12" fill="#FFF3DC" stroke="#E08A00" stroke-width="2.5"/><text x="62.0" y="373.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7A4A00">United's press was disconnected</text><text x="500.0" y="369.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7A4A00">Described by a tactical article (gaps between midfielders and the</text><text x="500.0" y="390.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7A4A00">front line), not shown in the data.</text><rect x="950" y="364" width="190" height="34" rx="17" fill="#E08A00"/><text x="1045.0" y="387.0" font-size="14" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#fff">Needs video</text><rect x="40" y="440" width="1120" height="92" rx="12" fill="#FBE9E7" stroke="#C0392B" stroke-width="2.5"/><text x="62.0" y="478.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">Baleba caused the improvement</text><text x="500.0" y="474.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">Improvement followed three changes at 59', but Spurs' adjustments and</text><text x="500.0" y="495.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">the changing game state also matter.</text><rect x="950" y="469" width="190" height="34" rx="17" fill="#C0392B"/><text x="1045.0" y="492.0" font-size="14" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#fff">Unproven</text><rect x="40" y="545" width="1120" height="92" rx="12" fill="#FFF3DC" stroke="#E08A00" stroke-width="2.5"/><text x="62.0" y="583.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7A4A00">United failed to protect the lead with</text><text x="62.0" y="607.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7A4A00">an extra man</text><text x="500.0" y="579.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7A4A00">Spurs scored after the red card. The exact defensive failure needs</text><text x="500.0" y="600.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7A4A00">footage to pin down.</text><rect x="950" y="574" width="190" height="34" rx="17" fill="#E08A00"/><text x="1045.0" y="597.0" font-size="14" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#fff">Outcome confirmed</text><text x="40.0" y="788.0" font-size="12" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">Schematic whiteboard illustration: positions are approximate. Match figures: Opta Analyst, Soccerway, xGStat and the shared reports; not independently verified.</text></svg>